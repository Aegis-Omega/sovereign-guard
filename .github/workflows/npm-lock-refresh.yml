name: NPM Lock Refresh Candidate

on:
  push:
    branches: [feat/npm-proof-carrying-release-v1]
    paths:
      - '.github/workflows/npm-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Assert exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ github.sha }}'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Pin npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = '11.19.0'

      - name: Refresh tsx within committed semver range
        run: npm update tsx --package-lock-only --ignore-scripts

      - name: Install refreshed lock exactly
        run: npm ci

      - name: Build and test refreshed graph
        run: |
          npm run build
          npm test

      - name: Audit refreshed dependency graph at LOW threshold
        run: npm audit --audit-level=low --json > npm-audit-refresh.json

      - name: Assert resolved dependency repair
        shell: bash
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const tsx = lock.packages['node_modules/tsx']?.version;
          const esbuild = lock.packages['node_modules/esbuild']?.version;
          if (tsx !== '4.23.12') throw new Error(`unexpected tsx: ${tsx}`);
          if (esbuild !== '0.28.2') throw new Error(`unexpected esbuild: ${esbuild}`);
          const audit = require('./npm-audit-refresh.json');
          if (audit.metadata?.vulnerabilities?.total !== 0) throw new Error('audit total is not zero');
          console.log(JSON.stringify({tsx, esbuild, vulnerabilities: audit.metadata.vulnerabilities}, null, 2));
          NODE

      - name: Commit verified lock and remove one-shot generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AEGIS npm verification'
          git config user.email '228550385+tarikskalic33@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/npm-lock-refresh.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_VERIFIED_LOCK_DELTA' >&2; exit 1; }
          git commit -m 'fix(npm): refresh lock past esbuild advisory'
          git push origin HEAD:feat/npm-proof-carrying-release-v1
