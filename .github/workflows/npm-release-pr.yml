name: NPM Release PR Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  preregistered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin current npm verification toolchain
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - name: Generate exact-source npm receipt
        id: receipt
        continue-on-error: true
        env:
          AEGIS_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/npm-proof-receipt.mjs >npm-receipt.stdout 2>npm-receipt.stderr
      - name: Upload receipt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-receipt-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            npm-receipt.stdout
            npm-receipt.stderr
            artifacts/NpmPackageReceiptV1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed if receipt generation failed
        if: steps.receipt.outcome != 'success'
        run: exit 1
