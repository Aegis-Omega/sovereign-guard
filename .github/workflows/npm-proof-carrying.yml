name: NPM Proof-Carrying Release

on:
  pull_request:
  push:
    branches:
      - feat/npm-proof-carrying-release-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generate proof-carrying npm receipt
        env:
          AEGIS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KEEP_NPM_TARBALL: '1'
        run: node scripts/npm-proof-receipt.mjs
      - name: Upload verified npm package evidence
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-guard-npm-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            sovereign-guard-*.tgz
            artifacts/NpmPackageReceiptV1.json
          if-no-files-found: error
          retention-days: 90
