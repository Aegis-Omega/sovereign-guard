name: NPM Proof-Carrying Release

on:
  pull_request:
  push:
    branches:
      - feat/npm-proof-carrying-release-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin current npm verification toolchain
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generate dependency vulnerability report
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit.json
      - name: Verify registry signatures and provenance attestations
        id: signatures
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit signatures --json --include-attestations > artifacts/npm-signatures.json
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format=cyclonedx > artifacts/sbom.cdx.json
      - name: Generate proof-carrying npm receipt
        env:
          AEGIS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KEEP_NPM_TARBALL: '1'
        run: node scripts/npm-proof-receipt.mjs
      - name: Hash supply-chain evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            artifacts/NpmPackageReceiptV1.json \
            artifacts/npm-audit.json \
            artifacts/npm-signatures.json \
            artifacts/sbom.cdx.json \
            > artifacts/supply-chain.sha256
      - name: Upload verified npm package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-guard-npm-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            sovereign-guard-*.tgz
            artifacts/NpmPackageReceiptV1.json
            artifacts/npm-audit.json
            artifacts/npm-signatures.json
            artifacts/sbom.cdx.json
            artifacts/supply-chain.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed on supply-chain verification debt
        if: steps.audit.outcome != 'success' || steps.signatures.outcome != 'success'
        run: exit 1
